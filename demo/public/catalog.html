<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog · SnapPromo Live</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css">
<script type="module" src="/catalog.js"></script>
</head>
<body><header><div class="bar"><a class="brand" href="/detect"><span class="lens" aria-hidden="true"></span>SnapPromo <span class="muted">Live</span></a>
<nav aria-label="เมนูหลัก"><a href="/catalog" aria-current="page">Catalog</a><a href="/detect">Detect</a></nav></div></header>
<main>
<div class="intro"><div><h1>คลังสินค้า</h1><p>เพิ่มรายละเอียดและภาพอ้างอิงสำหรับจับคู่สินค้าจากไลฟ์</p></div><a class="textlink" href="/detect">ไปหน้าตรวจจับ ↗</a></div>
<div class="layout catalog"><section class="card"><div class="cardhead"><h2>สินค้าในคลัง</h2><span id="count" class="technical"></span></div><p id="list-status" role="status"></p><div id="products"></div></section>
<section class="card"><h2>เพิ่มสินค้า</h2><form id="add"><div class="pair"><label class="field">รหัสสินค้า<input name="id" required maxlength="64" pattern="[A-Za-z0-9_\-]+" placeholder="เช่น chili"></label><label class="field">ราคา (บาท)<input name="price" type="number" min="0" step="0.01" required placeholder="0.00"></label></div>
<label class="field">ชื่อสินค้า<input name="name" required maxlength="120"></label>
<label class="field">คำอธิบายสั้น<textarea name="description" required maxlength="500" rows="2" placeholder="สี รูปร่าง หรือลักษณะบรรจุภัณฑ์"></textarea></label>
<label class="field">จุดแยกรุ่น <span class="muted">(ถ้ามีสินค้าหน้าตาคล้ายกัน)</span><textarea name="distinct" maxlength="300" rows="2" placeholder="เช่น ฝาหลอด มีหูจับ ทรงตรง — ต่างจาก T02 ที่เป็นฝายกดื่ม ไม่มีหู"></textarea><small>บอกเฉพาะสิ่งที่กล้องมองเห็น เช่น ฝา หูจับ ลาย สี รูปทรง</small></label>
<label class="field">รูปอ้างอิง 1–3 รูป<input type="file" name="images" multiple required accept="image/jpeg,image/png,image/webp"><small>JPEG, PNG, WebP · สูงสุดรูปละ 8 MB</small></label>
<button class="primary">เพิ่มเข้าคลัง <span aria-hidden="true">＋</span></button><p id="save-status" role="status"></p></form></section></div></main></body></html>
