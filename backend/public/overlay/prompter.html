<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Live prompter</title>
  <link rel="stylesheet" href="prompter.css">
  <script defer src="prompter.js"></script>
</head>
<body>
  <main id="prompter" data-state="idle">
    <header>
      <span id="stage"></span>
      <span id="link" role="status">รอเชื่อมต่อ</span>
    </header>
    <p id="warning" hidden></p>
    <ol id="lines" aria-live="polite"></ol>
    <p id="idle">พูดต่อได้เลย ระบบกำลังฟังอยู่ บรรทัดที่ควรพูดต่อจะขึ้นที่นี่</p>
  </main>
</body>
</html>
